<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClubTime - Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="login.html">ClubTime!</a>
    <h1>Sign up</h1>

    <form id="signupForm" class="form-stack">
      <label>
        Name
        <input id="signupName" type="text" required autocomplete="name">
      </label>

      <label>
        Username
        <input id="signupUsername" type="text" required autocomplete="username">
      </label>

      <label>
        Password
        <input id="signupPassword" type="password" minlength="6" required autocomplete="new-password">
      </label>

      <button class="primary-button" type="submit">Create account</button>
    </form>

    <p class="form-switch">
      Already have an account? <a href="login.html">Login</a>
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
